name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download Vosk English model (offline speech recognition)
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          rm model.zip
          mv vosk-model-small-en-us-0.15 model-en-us
          uuidgen > model-en-us/uuid
          ls -la model-en-us model-en-us/graph
          echo "== คำหยาบที่โมเดลเสียงรู้จัก =="
          for w in fuck fucking motherfucker shit bullshit bitch asshole bastard damn; do
            if grep -q "^$w " model-en-us/graph/words.txt 2>/dev/null; then echo "$w: มี"; else echo "$w: ไม่มี"; fi
          done

      # ระหว่างที่ repo ยังเป็น public: เก็บกุญแจไว้ใน cache ให้ทุก build ใช้กุญแจเดิม (ติดตั้งทับได้)
      - name: Restore signing key
        if: ${{ hashFiles('app/livesub.keystore') == '' }}
        uses: actions/cache@v4
        with:
          path: app/livesub.keystore
          key: livesub-keystore-v1

      - name: Signing key (ใช้ไฟล์ใน repo/cache ถ้ามี ไม่งั้นสร้างใหม่)
        run: |
          if [ ! -f app/livesub.keystore ]; then
            echo "::warning::ไม่มี app/livesub.keystore — สร้างกุญแจใหม่"
            keytool -genkeypair -keystore app/livesub.keystore -alias livesub -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass livesub123 -keypass livesub123 -dname "CN=LiveSub, O=Personal, C=TH"
          fi

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/LiveSub-TH.apk
          ls -la out

      # พอ repo เป็น private แล้ว ย้ายกุญแจจาก cache เข้า repo ถาวร (ครั้งเดียว)
      - name: Save signing key into private repo
        if: ${{ github.event.repository.private }}
        run: |
          if ! git ls-files --error-unmatch app/livesub.keystore >/dev/null 2>&1; then
            git config user.name "LiveSub CI"
            git config user.email "ci@users.noreply.github.com"
            git add -f app/livesub.keystore
            git commit -m "Store signing key (repo is private) [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LiveSub-TH-apk
          path: out/LiveSub-TH.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/LiveSub-TH.apk \
            --title "LiveSub TH (build ${{ github.run_number }})" \
            --notes "ดาวน์โหลด LiveSub-TH.apk แล้วติดตั้งบนมือถือ"
